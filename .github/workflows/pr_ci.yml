name: Pull Requests CI

on:
  pull_request:
    branches:
      - '*'

  workflow_dispatch:

jobs:
  build_linux:
    name: Linux
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        config:
        - { name: "GCC", cc: gcc, cxx: g++ }
        - { name: "clang", cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Set Environment Variables
        if: ${{ matrix.config.cc == 'gcc' }}
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_REF=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          echo "INSTALL_NAME=pragtical-${GITHUB_REF##*/}-linux-$(uname -m)-portable" >> "$GITHUB_ENV"
      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: 3.9
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
      - name: Update Packages
        run: sudo apt-get update
      - name: Install Dependencies
        run: bash scripts/install-dependencies.sh --debug
      - name: Build
        run: |
          bash --version
          bash scripts/build.sh --debug --forcefallback --portable
      - name: Run Tests
        run: |
          source scripts/common.sh
          SDL_VIDEO_DRIVER=dummy SDL_AUDIO_DRIVER=dummy ./scripts/run-local "$(get_default_build_dir)" test scripts/lua/tests
      - name: Package
        if: ${{ matrix.config.cc == 'gcc' }}
        run: bash scripts/package.sh --version ${INSTALL_REF} --debug --binary
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        if: ${{ matrix.config.cc == 'gcc' }}
        with:
          name: Linux x86_64
          path: ${{ env.INSTALL_NAME }}.tar.gz

  build_macos:
    name: macOS
    strategy:
      matrix:
        config:
          - arch: x86_64
            image: macos-15-intel
          - arch: arm64
            image: macos-15
    runs-on: ${{ matrix.config.image }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: System Information
        run: |
          system_profiler SPSoftwareDataType
          bash --version
          gcc -v
          xcodebuild -version
      - name: Set Environment Variables
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INSTALL_REF=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          echo "INSTALL_NAME=pragtical-${GITHUB_REF##*/}-macos-${{ matrix.config.arch }}" >> "$GITHUB_ENV"
      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: 3.9
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
      - name: Install Dependencies
        run: bash scripts/install-dependencies.sh --debug
      - name: Build
        run: |
          bash --version
          bash scripts/build.sh --bundle --debug --forcefallback
      - name: Run Tests
        run: |
          source scripts/common.sh
          SDL_VIDEO_DRIVER=dummy SDL_AUDIO_DRIVER=dummy ./scripts/run-local "$(get_default_build_dir)" test scripts/lua/tests
      - name: Create DMG Image
        run: bash scripts/package.sh --version ${INSTALL_REF} --debug --dmg
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macOS DMG ${{ matrix.config.arch }}
          path: ${{ env.INSTALL_NAME }}.dmg

  build_windows_msvc:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Build Windows packages
        uses: ./.github/actions/windows-build
        with:
          configuration: pr
          version: ${{ github.event.pull_request.number || github.run_number }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows MSVC x64
          path: |
            artifacts/windows/*.zip
            artifacts/windows/*-setup.exe
          if-no-files-found: error
